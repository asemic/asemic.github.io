---
layout: default
---


<body>


<article role="article" class="post">
	<div class="post-meta">
  <h1>{{ page.title }}</h1>
  <p class="subtitle" datetime="{{ page.date | date_to_xmlschema }}"> <span style="float:left;line-height: 1;">
  {{ page.date | date: "%B %-d, %Y" }}</span> 
  <!-- <span style="float:right;">{% include readtime.html %}</span></p> -->
	</div>
  <br> <a style="font-size:0.77em;line-height: 1.5;">
  <!-- <br> <a style="font-size:0.77em; padding-left:2em; text-indent:-2em;"> -->
  {{ content }}
  </a>
  <br>
  <p>
      {% for tag in page.tags %}
      <a href="/tag/{{tag}}">#{{tag}}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}
    </p>     
        <!--UPDATE 5/5/2020: I disabled tags because they just don't fuckn work.-->              
 <hr style="height:2px; border:none; margin: 1rem 0; background-color:#e7e9ee;">
 {% include return.html %}
</article>

</body>
